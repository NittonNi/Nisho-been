<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Nisho — Your World</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
/* ─── RESET & BASE ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior-y: none; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c;
  color: #e8e4de;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ─── LAYOUT ────────────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: #0c0c0c;
}

/* ─── GLOBAL ADD BUTTON ─────────────────────────────────────── */
.global-add-fab {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #b8e060;
  color: #0c0c0c;
  border: none;
  font-size: 26px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  box-shadow: 0 4px 14px rgba(184, 224, 96, 0.2);
  transition: transform 0.2s;
}
.global-add-fab:active { transform: scale(0.92); }

/* ─── SCREENS ───────────────────────────────────────────────── */
.screen {
  display: none;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 90px;
}
.screen.active { display: flex; flex-direction: column; }

/* ─── BOTTOM NAV ────────────────────────────────────────────── */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 72px;
  background: #111;
  border-top: 1px solid #1f1f1f;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 4px;
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 2px;
  background: none;
  border: none;
  color: #444;
  font-size: 9px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: color 0.2s;
}
.nav-item.active { color: #e8e4de; }
.nav-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.nav-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ─── COMMON HEADERS ────────────────────────────────────────── */
.screen-header {
  padding: 24px 80px 16px 20px; /* Right padding for the floating button */
  border-bottom: 1px solid #1a1a1a;
  flex-shrink: 0;
}
.screen-title { font-size: 22px; font-weight: 300; color: #e8e4de; }
.screen-sub { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }

/* ─── SCREEN: MAP ───────────────────────────────────────────── */
#world-map-svg {
  width: 100%;
  flex-shrink: 0;
  display: block;
  background: #080808;
  cursor: grab;
}
#world-map-svg:active { cursor: grabbing; }

.map-stats-row {
  display: flex;
  padding: 16px 20px;
  border-top: 1px solid #1a1a1a;
  border-bottom: 1px solid #1a1a1a;
}
.map-stat { flex: 1; text-align: center; border-right: 1px solid #1a1a1a; padding: 0 8px; }
.map-stat:first-child { text-align: left; padding-left: 0; }
.map-stat:last-child { border-right: none; }
.map-stat-num { font-size: 26px; font-weight: 300; color: #e8e4de; margin-bottom: 3px; line-height: 1;}
.map-stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #444; }

/* ─── SCREEN: ROADMAP (TIMELINE) ────────────────────────────── */
.timeline-container { padding: 24px 20px; }
.timeline-line { border-left: 2px solid #222; padding-left: 20px; margin-left: 8px; }
.trip-card {
  position: relative;
  background: #141414;
  border: 1px solid #1e1e1e;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 24px;
}
.trip-card::before {
  content: '';
  position: absolute;
  left: -27px;
  top: 16px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #b8e060;
  border: 3px solid #0c0c0c;
}
.trip-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.trip-title { font-size: 16px; font-weight: 500; color: #e8e4de; }
.trip-dates { font-size: 11px; color: #666; margin-top: 2px; }
.trip-transport { font-size: 18px; }
.trip-meta {
  display: flex; gap: 8px; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #1f1f1f;
}
.meta-chip {
  font-size: 10px; background: #1a1a1a; padding: 4px 8px;
  border-radius: 4px; color: #888; text-transform: uppercase; letter-spacing: 0.05em;
}
.meta-chip.hotel { background: #1a2e05; color: #7ab83a; }

/* ─── SCREEN: COUNTRIES & AIRPORTS ───────────────────────────── */
.search-box {
  display: flex; align-items: center; background: #181818;
  border: 1px solid #222; border-radius: 8px; padding: 0 12px; gap: 8px; margin-top: 14px;
}
.search-box input { flex: 1; background: none; border: none; padding: 10px 0; font-size: 13px; color: #e8e4de; outline: none; }
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 20px;
  border-bottom: 1px solid #141414;
}
.list-item-title { font-size: 14px; color: #d8d4ce; flex: 1; }
.list-item-sub { font-size: 11px; color: #555; }
.check-icon { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
.check-icon.active { background: #b8e060; border-color: #b8e060; }
.check-icon.active svg { stroke: #000; width: 12px; height: 12px; }

/* ─── MODALS & FORMS ────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
.modal-sheet {
  background: #111; border-radius: 20px 20px 0 0; padding: 0 0 40px;
  width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}
.modal-handle { width: 36px; height: 4px; background: #222; border-radius: 2px; margin: 12px auto 20px; }
.type-selector { display: flex; gap: 8px; padding: 0 20px 16px; border-bottom: 1px solid #1a1a1a; }
.type-btn {
  flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #222; background: transparent; color: #555; font-size: 12px; font-weight: 500; transition: all 0.15s;
}
.type-btn.active { background: #1a2e05; border-color: #7ab83a; color: #b8e060; }

.field-group { margin-bottom: 16px; }
.field-group label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 6px; }
.field-group input, .field-group select {
  width: 100%; background: #181818; border: 1px solid #222; border-radius: 8px;
  padding: 10px 12px; font-size: 14px; color: #e8e4de; outline: none; appearance: none;
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn-save { width: 100%; padding: 14px; background: #e8e4de; border: none; border-radius: 8px; color: #0c0c0c; font-weight: 600; margin-top: 10px; }
.hidden { display: none !important; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="app">

  <button class="global-add-fab" onclick="openAddModal()">+</button>

  <!-- ═══ SCREEN: MAP ════════════════════════════════════════ -->
  <div class="screen active" id="screen-map">
    <div class="screen-header">
      <div class="screen-sub">Your World</div>
      <div class="screen-title"><span id="hdr-count">0</span> countries</div>
    </div>

    <svg id="world-map-svg" viewBox="0 0 900 460">
      <rect width="900" height="460" fill="transparent"/>
      <!-- Map renders here -->
    </svg>

    <div class="map-stats-row">
      <div class="map-stat">
        <div class="map-stat-num" id="stat-trips">0</div>
        <div class="map-stat-label">Trips</div>
      </div>
      <div class="map-stat">
        <div class="map-stat-num" id="stat-days">0</div>
        <div class="map-stat-label">Days Away</div>
      </div>
      <div class="map-stat">
        <div class="map-stat-num" id="stat-airports">0</div>
        <div class="map-stat-label">Airports</div>
      </div>
    </div>
  </div>

  <!-- ═══ SCREEN: ROADMAP ════════════════════════════════════ -->
  <div class="screen" id="screen-roadmap">
    <div class="screen-header">
      <div class="screen-sub">Storyline</div>
      <div class="screen-title">Your Trips</div>
    </div>
    <div class="timeline-container">
      <div class="timeline-line" id="timeline-list">
        <!-- Trips injected here -->
      </div>
    </div>
  </div>

  <!-- ═══ SCREEN: COUNTRIES ═══════════════════════════════════ -->
  <div class="screen" id="screen-countries">
    <div class="screen-header">
      <div class="screen-sub">Exploration</div>
      <div class="screen-title">Countries</div>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search..." id="country-search" oninput="renderCountries()" />
      </div>
    </div>
    <div id="countries-list"></div>
  </div>

  <!-- ═══ SCREEN: AIRPORTS ════════════════════════════════════ -->
  <div class="screen" id="screen-airports">
    <div class="screen-header">
      <div class="screen-sub">Aviation</div>
      <div class="screen-title">Airports</div>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search by IATA or City..." id="airport-search" oninput="renderAirports()" />
      </div>
    </div>
    <div id="airports-list"></div>
  </div>

  <!-- ═══ BOTTOM NAV ════════════════════════════════════════════ -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchScreen('map', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></div>
      Map
    </button>
    <button class="nav-item" onclick="switchScreen('roadmap', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="12" r="2"/></svg></div>
      Roadmap
    </button>
    <button class="nav-item" onclick="switchScreen('countries', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10"/></svg></div>
      Countries
    </button>
    <button class="nav-item" onclick="switchScreen('airports', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21.5 4s-2 .5-3.5 2L14.5 9.5 6.3 7.7l-1.6 1.6 5.4 3.7-4 4-2.8-.9-1.4 1.4 3.4 1.1 1.1 3.4 1.4-1.4-.9-2.8 4-4 3.7 5.4 1.6-1.6z"/></svg></div>
      Airports
    </button>
  </nav>
</div>

<!-- ═══ ADD MODAL ═════════════════════════════════════════════ -->
<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="type-selector">
      <button class="type-btn active" id="btn-tab-trip" onclick="switchModalTab('trip')">Log Trip</button>
      <button class="type-btn" id="btn-tab-airport" onclick="switchModalTab('airport')">Log Airport</button>
    </div>

    <!-- TRIP FORM -->
    <div id="form-trip" style="padding: 0 20px;">
      <div class="field-group">
        <label>Destination Country</label>
        <select id="i-country" onchange="checkUSState()"><option value="">Select country...</option></select>
      </div>
      <div class="field-group hidden" id="fg-state">
        <label>US State</label>
        <select id="i-state"><option value="">Select state...</option></select>
      </div>
      <div class="field-row">
        <div class="field-group"><label>Arrival</label><input type="date" id="i-arr" /></div>
        <div class="field-group"><label>Departure</label><input type="date" id="i-dep" /></div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label>Transport</label>
          <select id="i-trans">
            <option value="✈️ Plane">✈️ Plane</option>
            <option value="🚆 Train">🚆 Train</option>
            <option value="🚗 Car">🚗 Car</option>
            <option value="🚌 Bus">🚌 Bus</option>
            <option value="🚢 Ship">🚢 Ship</option>
          </select>
        </div>
        <div class="field-group"><label>Hotel Name</label><input type="text" id="i-hotel" placeholder="Optional..." /></div>
      </div>
      <button class="btn-save" onclick="saveTrip()">Save Trip</button>
    </div>

    <!-- AIRPORT FORM -->
    <div id="form-airport" class="hidden" style="padding: 0 20px;">
      <div class="field-group">
        <label>Select Airport</label>
        <select id="i-airport"><option value="">Search major airports...</option></select>
      </div>
      <button class="btn-save" onclick="saveAirport()">Save Airport</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
// ─── DATA & CONSTANTS ──────────────────────────────────────────
const COUNTRIES = [
  {code:'US', name:'United States', flag:'🇺🇸'},
  {code:'JP', name:'Japan', flag:'🇯🇵'},
  {code:'FR', name:'France', flag:'🇫🇷'},
  {code:'IT', name:'Italy', flag:'🇮🇹'},
  {code:'ES', name:'Spain', flag:'🇪🇸'},
  {code:'GB', name:'United Kingdom', flag:'🇬🇧'},
  {code:'DE', name:'Germany', flag:'🇩🇪'},
  {code:'MX', name:'Mexico', flag:'🇲🇽'},
  {code:'CA', name:'Canada', flag:'🇨🇦'},
  // Para mantener el código corto en este ejemplo, añade más aquí...
].sort((a,b) => a.name.localeCompare(b.name));

const US_STATES = [
  {code:'CA', name:'California'}, {code:'NY', name:'New York'}, 
  {code:'FL', name:'Florida'}, {code:'TX', name:'Texas'},
  {code:'IL', name:'Illinois'}, {code:'NV', name:'Nevada'},
  // ... añadir el resto
];

const AIRPORTS = [
  {code:'JFK', name:'John F. Kennedy', city:'New York'},
  {code:'LAX', name:'Los Angeles Intl', city:'Los Angeles'},
  {code:'LHR', name:'Heathrow', city:'London'},
  {code:'CDG', name:'Charles de Gaulle', city:'Paris'},
  {code:'HND', name:'Haneda', city:'Tokyo'},
  {code:'MAD', name:'Adolfo Suárez', city:'Madrid'},
  {code:'FRA', name:'Frankfurt am Main', city:'Frankfurt'},
].sort((a,b) => a.city.localeCompare(b.city));

// Mapeo TopoJSON ID a ISO A2
const numToA2 = { 840:'US', 392:'JP', 250:'FR', 380:'IT', 724:'ES', 826:'GB', 276:'DE', 484:'MX', 124:'CA' };

// ─── STATE ─────────────────────────────────────────────────────
let state = {
  trips: [],      // { id, country, state, arr, dep, trans, hotel }
  airports: [],   // ['JFK', 'MAD']
  manualVisited: [] // Códigos de países marcados manualmente sin viaje
};

let mapSvg, mapG, pathGen, zoom;

// ─── INIT & LOCAL STORAGE ──────────────────────────────────────
function loadData() {
  const d = localStorage.getItem('nisho_data_v2');
  if (d) state = JSON.parse(d);
  
  // Rellenar Selects
  const cSel = document.getElementById('i-country');
  COUNTRIES.forEach(c => cSel.add(new Option(c.flag + ' ' + c.name, c.code)));
  
  const sSel = document.getElementById('i-state');
  US_STATES.forEach(s => sSel.add(new Option(s.name, s.code)));
  
  const aSel = document.getElementById('i-airport');
  AIRPORTS.forEach(a => aSel.add(new Option(`${a.code} - ${a.city}`, a.code)));

  updateUI();
  initMap();
}

function saveData() {
  localStorage.setItem('nisho_data_v2', JSON.stringify(state));
  updateUI();
}

// ─── LOGIC & STATS ─────────────────────────────────────────────
function getVisitedCountries() {
  const set = new Set(state.manualVisited);
  state.trips.forEach(t => set.add(t.country));
  return set;
}

function updateUI() {
  const visited = getVisitedCountries();
  const totalDays = state.trips.reduce((acc, t) => {
    if (!t.arr || !t.dep) return acc;
    const diffTime = Math.abs(new Date(t.dep) - new Date(t.arr));
    return acc + Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  }, 0);

  document.getElementById('hdr-count').textContent = visited.size;
  document.getElementById('stat-trips').textContent = state.trips.length;
  document.getElementById('stat-days').textContent = totalDays;
  document.getElementById('stat-airports').textContent = state.airports.length;

  renderMap();
  renderRoadmap();
  renderCountries();
  renderAirports();
}

// ─── MAP (D3 + ZOOM) ───────────────────────────────────────────
function initMap() {
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r => r.json())
    .then(world => {
      const geo = topojson.feature(world, world.objects.countries);
      geo.features.forEach(f => f.properties.iso = numToA2[parseInt(f.id)]);

      const projection = d3.geoNaturalEarth1().scale(150).translate([450, 240]);
      pathGen = d3.geoPath().projection(projection);
      
      mapSvg = d3.select('#world-map-svg');
      mapG = mapSvg.append('g');

      // Zoom Behavior
      zoom = d3.zoom()
        .scaleExtent([1, 8])
        .on('zoom', e => mapG.attr('transform', e.transform));
      mapSvg.call(zoom);

      mapG.selectAll('.country')
        .data(geo.features)
        .enter()
        .append('path')
        .attr('class', 'country')
        .attr('d', pathGen)
        .attr('stroke', '#0c0c0c')
        .attr('stroke-width', 0.5)
        .on('click', function(event, d) {
          // Centrar en el país
          const bounds = pathGen.bounds(d);
          const dx = bounds[1][0] - bounds[0][0];
          const dy = bounds[1][1] - bounds[0][1];
          const x = (bounds[0][0] + bounds[1][0]) / 2;
          const y = (bounds[0][1] + bounds[1][1]) / 2;
          const scale = Math.max(1, Math.min(8, 0.9 / Math.max(dx / 900, dy / 460)));
          const translate = [450 - scale * x, 240 - scale * y];

          mapSvg.transition().duration(750).call(
            zoom.transform, 
            d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
          );
        });

      renderMap();
    });
}

function renderMap() {
  if (!mapG) return;
  const visited = getVisitedCountries();
  mapG.selectAll('.country').attr('fill', d => {
    return visited.has(d.properties.iso) ? '#b8e060' : '#1e1e1e';
  });
}

// ─── ROADMAP (TIMELINE) ────────────────────────────────────────
function renderRoadmap() {
  const container = document.getElementById('timeline-list');
  container.innerHTML = '';
  
  if (!state.trips.length) {
    container.innerHTML = '<div style="color:#555; font-size:12px;">No trips logged yet. Tap + to add one.</div>';
    return;
  }

  // Ordenar de más reciente a más antiguo
  const sorted = [...state.trips].sort((a,b) => new Date(b.arr) - new Date(a.arr));

  sorted.forEach(t => {
    const c = COUNTRIES.find(x => x.code === t.country);
    const s = US_STATES.find(x => x.code === t.state);
    const title = c ? `${c.flag} ${c.name}` : 'Unknown';
    const loc = s ? `<span style="color:#888">, ${s.name}</span>` : '';
    
    // Días
    let days = 0;
    if(t.arr && t.dep) {
      days = Math.ceil(Math.abs(new Date(t.dep) - new Date(t.arr)) / (1000 * 60 * 60 * 24));
    }

    container.innerHTML += `
      <div class="trip-card">
        <div class="trip-header">
          <div>
            <div class="trip-title">${title}${loc}</div>
            <div class="trip-dates">${t.arr} to ${t.dep}</div>
          </div>
          <div class="trip-transport">${t.trans.split(' ')[0]}</div>
        </div>
        <div class="trip-meta">
          <div class="meta-chip">${days} Days</div>
          ${t.hotel ? `<div class="meta-chip hotel">🏨 ${t.hotel}</div>` : ''}
        </div>
      </div>
    `;
  });
}

// ─── COUNTRIES & AIRPORTS ──────────────────────────────────────
function renderCountries() {
  const q = document.getElementById('country-search').value.toLowerCase();
  const list = document.getElementById('countries-list');
  const visited = getVisitedCountries();
  list.innerHTML = '';

  COUNTRIES.filter(c => c.name.toLowerCase().includes(q)).forEach(c => {
    const isV = visited.has(c.code);
    list.innerHTML += `
      <div class="list-item" onclick="toggleCountry('${c.code}')">
        <span style="font-size: 20px;">${c.flag}</span>
        <div class="list-item-title">${c.name}</div>
        <div class="check-icon ${isV ? 'active' : ''}">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>`;
  });
}

function toggleCountry(code) {
  if (state.manualVisited.includes(code)) {
    state.manualVisited = state.manualVisited.filter(c => c !== code);
  } else {
    state.manualVisited.push(code);
  }
  saveData();
}

function renderAirports() {
  const q = document.getElementById('airport-search').value.toLowerCase();
  const list = document.getElementById('airports-list');
  list.innerHTML = '';

  state.airports.forEach(code => {
    const a = AIRPORTS.find(x => x.code === code) || { name:'Unknown', city:'Unknown' };
    if (!a.city.toLowerCase().includes(q) && !code.toLowerCase().includes(q)) return;
    
    list.innerHTML += `
      <div class="list-item">
        <span style="font-size: 18px;">✈️</span>
        <div class="list-item-title" style="display:flex; justify-content:space-between">
          <span>${a.city}</span>
          <strong style="color:#b8e060">${code}</strong>
        </div>
      </div>`;
  });
}

// ─── MODAL LOGIC ───────────────────────────────────────────────
function openAddModal() { document.getElementById('add-modal').classList.add('open'); }
function closeModal() { document.getElementById('add-modal').classList.remove('open'); }

function switchModalTab(tab) {
  document.getElementById('btn-tab-trip').classList.toggle('active', tab === 'trip');
  document.getElementById('btn-tab-airport').classList.toggle('active', tab === 'airport');
  document.getElementById('form-trip').classList.toggle('hidden', tab !== 'trip');
  document.getElementById('form-airport').classList.toggle('hidden', tab !== 'airport');
}

function checkUSState() {
  const isUS = document.getElementById('i-country').value === 'US';
  document.getElementById('fg-state').classList.toggle('hidden', !isUS);
}

function saveTrip() {
  const c = document.getElementById('i-country').value;
  if (!c) return alert("Select a country");
  
  state.trips.push({
    id: Date.now().toString(),
    country: c,
    state: c === 'US' ? document.getElementById('i-state').value : '',
    arr: document.getElementById('i-arr').value,
    dep: document.getElementById('i-dep').value,
    trans: document.getElementById('i-trans').value,
    hotel: document.getElementById('i-hotel').value
  });
  
  saveData();
  closeModal();
}

function saveAirport() {
  const a = document.getElementById('i-airport').value;
  if (!a) return;
  if (!state.airports.includes(a)) state.airports.push(a);
  saveData();
  closeModal();
}

// ─── NAVIGATION ────────────────────────────────────────────────
function switchScreen(id, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  btn.classList.add('active');
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
