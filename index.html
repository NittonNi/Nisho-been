<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- META TAGS CLAVES PARA iPHONE (PWA A PANTALLA COMPLETA) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0c0c0c" />
<title>Nisho — Your World</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
/* ─── RESET & BASE ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior-y: none; } /* Evita el 'bounce' en iOS */

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c;
  color: #e8e4de;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ─── LAYOUT ────────────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: #0c0c0c;
  padding-bottom: env(safe-area-inset-bottom); /* Soporte para el 'notch' de iPhone */
}

/* ─── FLOATING ADD BUTTON ───────────────────────────────────── */
.global-add-fab {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #b8e060;
  color: #0c0c0c;
  border: none;
  font-size: 26px;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  box-shadow: 0 4px 14px rgba(184, 224, 96, 0.15);
  transition: transform 0.2s;
}
.global-add-fab:active { transform: scale(0.92); }

/* ─── SCREENS ───────────────────────────────────────────────── */
.screen {
  display: none;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 90px;
}
.screen.active { display: flex; flex-direction: column; }

/* ─── BOTTOM NAV ────────────────────────────────────────────── */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: calc(72px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(17, 17, 17, 0.95);
  backdrop-filter: blur(10px);
  border-top: 1px solid #1f1f1f;
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
}

.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; background: none; border: none; color: #444; font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s;
}
.nav-item.active { color: #e8e4de; }
.nav-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.nav-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ─── SCREEN HEADERS ────────────────────────────────────────── */
.screen-header { padding: max(24px, env(safe-area-inset-top)) 80px 16px 20px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
.screen-title { font-size: 24px; font-weight: 300; color: #e8e4de; }
.screen-sub { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }

/* ─── MAP SCREEN ────────────────────────────────────────────── */
#world-map-svg { width: 100%; flex-shrink: 0; display: block; background: #080808; cursor: grab; }
#world-map-svg:active { cursor: grabbing; }

.map-stats-row { display: flex; padding: 16px 20px; border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
.map-stat { flex: 1; text-align: center; border-right: 1px solid #1a1a1a; padding: 0 8px; }
.map-stat:first-child { text-align: left; padding-left: 0; }
.map-stat:last-child { border-right: none; }
.map-stat-num { font-size: 26px; font-weight: 300; color: #e8e4de; line-height: 1; margin-bottom: 3px; }
.map-stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #444; }

.progress-wrap { height: 2px; background: #1a1a1a; border-radius: 1px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 2px; background: #b8e060; border-radius: 1px; transition: width 0.8s; }

/* ─── COUNTRIES SCREEN ──────────────────────────────────────── */
.search-box { display: flex; align-items: center; background: #181818; border: 1px solid #222; border-radius: 8px; padding: 0 12px; gap: 8px; margin-top: 16px; }
.search-box svg { width: 14px; height: 14px; stroke: #444; }
.search-box input { flex: 1; background: none; border: none; padding: 10px 0; font-size: 13px; color: #e8e4de; outline: none; }
.country-item { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid #141414; cursor: pointer; transition: background 0.12s; }
.country-item:active { background: #111; }
.country-flag { font-size: 22px; width: 30px; text-align: center; }
.country-info { flex: 1; }
.country-name { font-size: 14px; color: #d8d4ce; }
.country-sub { font-size: 11px; color: #3a3a3a; margin-top: 2px; }

/* ─── ROADMAP SCREEN ────────────────────────────────────────── */
.roadmap-container { padding: 20px; }
.trip-card { background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; cursor: pointer; position: relative; overflow: hidden; }
.trip-card:active { background: #1a1a1a; }
.trip-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #b8e060; }
.trip-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.trip-country { font-size: 16px; font-weight: 500; color: #e8e4de; }
.trip-dates { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
.trip-trans { font-size: 18px; }
.trip-details { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #1a1a1a; padding-top: 10px; }
.detail-line { font-size: 12px; color: #888; display: flex; gap: 8px; align-items: flex-start; }
.detail-icon { font-size: 14px; }
.hotel-highlight { color: #b8e060; font-weight: 500; }

/* ─── PROFILE & AIRTABLE (From Original) ────────────────────── */
.profile-header { padding: max(32px, env(safe-area-inset-top)) 20px 24px; border-bottom: 1px solid #1a1a1a; }
.profile-avatar { width: 68px; height: 68px; border-radius: 50%; background: #1a1a1a; border: 1px solid #252525; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 14px; }
.profile-name { font-size: 20px; font-weight: 500; color: #e8e4de; margin-bottom: 4px; }
.profile-handle { font-size: 12px; color: #3a3a3a; letter-spacing: 0.04em; }

.airtable-config { margin: 20px; background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 16px; }
.airtable-title { font-size: 12px; font-weight: 500; color: #e8e4de; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.airtable-status { font-size: 10px; padding: 2px 7px; border-radius: 3px; background: #1a2e05; color: #7ab83a; }
.airtable-status.disconnected { background: #2a1a05; color: #b87a3a; }
.airtable-field { margin-bottom: 10px; }
.airtable-field label { display: block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #555; margin-bottom: 5px; }
.airtable-field input { width: 100%; background: #0c0c0c; border: 1px solid #222; border-radius: 6px; padding: 10px; font-size: 12px; color: #e8e4de; outline: none; }
.btn-connect { width: 100%; padding: 12px; background: #e8e4de; color: #0c0c0c; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 10px; }

/* ─── MODALS & BOTTOM SHEETS ────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-sheet { background: #111; border-radius: 20px 20px 0 0; padding: 0 0 calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1); }
.modal-handle { width: 36px; height: 4px; background: #222; border-radius: 2px; margin: 12px auto 20px; }
.modal-title { font-size: 22px; font-weight: 500; color: #e8e4de; padding: 0 20px; margin-bottom: 16px; }

/* Form Fields inside Modal */
.field-group { padding: 0 20px; margin-bottom: 16px; }
.field-group label { display: block; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #555; margin-bottom: 6px; }
.field-group input, .field-group select { width: 100%; background: #181818; border: 1px solid #222; border-radius: 8px; padding: 12px; font-size: 14px; color: #e8e4de; outline: none; appearance: none; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; margin-bottom: 16px; }

.modal-actions { display: flex; gap: 10px; padding: 10px 20px 0; border-top: 1px solid #1a1a1a; margin-top: 20px; }
.btn-save { flex: 2; padding: 14px; background: #e8e4de; border: none; border-radius: 8px; color: #0c0c0c; font-weight: 600; }
.btn-delete { flex: 1; padding: 14px; background: #2a0a0a; border: 1px solid #3a1414; border-radius: 8px; color: #b84040; font-weight: 500; display: none; }
.btn-outline { width: calc(100% - 40px); margin: 0 20px; padding: 12px; background: transparent; border: 1px solid #b8e060; color: #b8e060; border-radius: 8px; font-weight: 500; }

/* Country detail specifically */
.country-sheet-hero { font-size: 60px; text-align: center; margin-bottom: 10px; }
.history-list { padding: 0 20px; margin-bottom: 20px; }

/* ─── UTILS ─────────────────────────────────────────────────── */
.hidden { display: none !important; }
.sync-bar { position: fixed; top: 0; left: 0; right: 0; background: #7ab83a; color: #0c0c0c; font-size: 11px; font-weight: 600; text-align: center; padding: max(6px, env(safe-area-inset-top)) 6px 6px; z-index: 500; transform: translateY(-100%); transition: transform 0.3s; }
.sync-bar.visible { transform: translateY(0); }
.sync-bar.error { background: #b83a3a; color: #fff; }
::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="sync-bar" id="sync-bar">Syncing with Airtable...</div>

<div class="app">
  
  <button class="global-add-fab" onclick="openTripForm()">+</button>

  <!-- ═══ MAP SCREEN ═════════════════════════════════════════ -->
  <div class="screen active" id="screen-map">
    <div class="screen-header">
      <div class="screen-sub">Nisho</div>
      <div class="screen-title">Your <span id="hdr-count">0</span> countries</div>
    </div>

    <svg id="world-map-svg" viewBox="0 0 900 460">
      <rect width="900" height="460" fill="transparent"/>
      <!-- Map rendered via D3 -->
    </svg>

    <div class="map-stats-row">
      <div class="map-stat">
        <div class="map-stat-num" id="stat-countries">0</div>
        <div class="map-stat-label">Countries</div>
        <div class="progress-wrap"><div class="progress-fill" id="progress-bar" style="width:0%"></div></div>
      </div>
      <div class="map-stat">
        <div class="map-stat-num" id="stat-trips">0</div>
        <div class="map-stat-label">Trips</div>
      </div>
      <div class="map-stat">
        <div class="map-stat-num" id="stat-days">0</div>
        <div class="map-stat-label">Days Away</div>
      </div>
    </div>
  </div>

  <!-- ═══ COUNTRIES SCREEN ═══════════════════════════════════ -->
  <div class="screen" id="screen-countries">
    <div class="screen-header">
      <div class="screen-sub">Exploration</div>
      <div class="screen-title">Countries</div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search country..." id="country-search" oninput="renderCountries()" />
      </div>
    </div>
    <div id="countries-list"></div>
  </div>

  <!-- ═══ ROADMAP SCREEN ═════════════════════════════════════ -->
  <div class="screen" id="screen-roadmap">
    <div class="screen-header">
      <div class="screen-sub">Storyline</div>
      <div class="screen-title">Roadmap</div>
    </div>
    <div class="roadmap-container" id="roadmap-list">
      <!-- Trips injected here -->
    </div>
  </div>

  <!-- ═══ PROFILE SCREEN ═════════════════════════════════════ -->
  <div class="screen" id="screen-profile">
    <div class="profile-header">
      <div class="profile-avatar">✦</div>
      <div class="profile-name" id="profile-name-display">Traveler</div>
      <div class="profile-handle">@houseofnisho</div>
    </div>

    <div class="airtable-config">
      <div class="airtable-title">
        Airtable Sync <span class="airtable-status disconnected" id="at-status">Disconnected</span>
      </div>
      <div class="airtable-field">
        <label>Personal Access Token</label>
        <input type="password" id="at-token" placeholder="pat..." />
      </div>
      <div class="airtable-field">
        <label>Base ID</label>
        <input type="text" id="at-base" placeholder="app..." />
      </div>
      <div class="airtable-field">
        <label>Trips Table Name</label>
        <input type="text" id="at-trips-table" placeholder="Trips" value="Trips" />
      </div>
      <button class="btn-connect" onclick="connectAirtable()">Connect & Sync</button>
    </div>
  </div>

  <!-- ═══ BOTTOM NAV ═════════════════════════════════════════ -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchScreen('map', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></div>
      Map
    </button>
    <button class="nav-item" onclick="switchScreen('countries', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      Countries
    </button>
    <button class="nav-item" onclick="switchScreen('roadmap', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="12" r="2"/></svg></div>
      Roadmap
    </button>
    <button class="nav-item" onclick="switchScreen('profile', this)">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      Profile
    </button>
  </nav>

</div>

<!-- ═══ MODALS ═══════════════════════════════════════════════ -->

<!-- 1. Country Detail Sheet -->
<div class="modal-overlay" id="country-sheet" onclick="if(event.target===this)closeModal('country-sheet')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="country-sheet-hero" id="cs-flag">🌍</div>
    <div class="modal-title" style="text-align:center" id="cs-name">Country</div>
    
    <div class="history-list" id="cs-history">
      <!-- Past trips injected here -->
    </div>

    <button class="btn-outline" onclick="openTripFormFromCountry()">+ Add Visit</button>
  </div>
</div>

<!-- 2. Trip Form (Add / Edit) -->
<div class="modal-overlay" id="trip-modal" onclick="if(event.target===this)closeModal('trip-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="tm-title">Log Trip</div>

    <div class="field-group">
      <label>Destination Country</label>
      <select id="i-country"><option value="">Select country...</option></select>
    </div>
    
    <div class="field-row">
      <div class="field-group" style="padding:0; margin:0"><label>Arrival</label><input type="date" id="i-arr" /></div>
      <div class="field-group" style="padding:0; margin:0"><label>Departure</label><input type="date" id="i-dep" /></div>
    </div>
    
    <div class="field-group">
      <label>Transport</label>
      <select id="i-trans">
        <option value="✈️ Plane">✈️ Plane</option>
        <option value="🚆 Train">🚆 Train</option>
        <option value="🚗 Car">🚗 Car</option>
        <option value="🚢 Ship">🚢 Ship</option>
      </select>
    </div>

    <div class="field-group">
      <label>Cities Visited (comma separated)</label>
      <input type="text" id="i-cities" placeholder="e.g. Tokyo, Kyoto, Osaka" />
    </div>

    <div class="field-group">
      <label>Hotels / Stays (comma separated)</label>
      <input type="text" id="i-hotels" placeholder="e.g. Aman Tokyo, Ritz Kyoto" />
    </div>

    <div class="modal-actions">
      <button class="btn-delete" id="tm-delete" onclick="deleteCurrentTrip()">Delete</button>
      <button class="btn-save" onclick="saveTrip()">Save</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
// ─── DATA & CONSTANTS ──────────────────────────────────────────
const TOTAL_COUNTRIES = 195;
// Reduje la lista para brevedad en código, pero el buscador funciona con estos.
const COUNTRIES = [
  {code:'US',name:'United States',flag:'🇺🇸'}, {code:'JP',name:'Japan',flag:'🇯🇵'},
  {code:'FR',name:'France',flag:'🇫🇷'}, {code:'IT',name:'Italy',flag:'🇮🇹'},
  {code:'ES',name:'Spain',flag:'🇪🇸'}, {code:'GB',name:'United Kingdom',flag:'🇬🇧'},
  {code:'DE',name:'Germany',flag:'🇩🇪'}, {code:'MX',name:'Mexico',flag:'🇲🇽'},
  {code:'CA',name:'Canada',flag:'🇨🇦'}, {code:'BR',name:'Brazil',flag:'🇧🇷'},
  {code:'CN',name:'China',flag:'🇨🇳'}, {code:'AU',name:'Australia',flag:'🇦🇺'},
  {code:'AR',name:'Argentina',flag:'🇦🇷'}, {code:'ZA',name:'South Africa',flag:'🇿🇦'}
].sort((a,b) => a.name.localeCompare(b.name));

const numToA2 = { 840:'US', 392:'JP', 250:'FR', 380:'IT', 724:'ES', 826:'GB', 276:'DE', 484:'MX', 124:'CA', 76:'BR', 156:'CN', 36:'AU', 32:'AR', 710:'ZA' };

// ─── STATE ─────────────────────────────────────────────────────
let state = {
  profile: { name: 'Traveler' },
  airtable: { token: '', base: '', tripsTable: 'Trips', connected: false },
  trips: [] // { id, airtableId, country, arr, dep, trans, cities, hotels }
};

let currentEditingId = null;
let currentCountryContext = null;
let mapSvg, mapG, pathGen, zoom;

// ─── INIT ──────────────────────────────────────────────────────
function init() {
  loadLocal();
  
  // Rellenar select de países
  const cSel = document.getElementById('i-country');
  COUNTRIES.forEach(c => cSel.add(new Option(c.flag + ' ' + c.name, c.code)));
  
  if (state.airtable.connected) {
    document.getElementById('at-status').textContent = 'Connected';
    document.getElementById('at-status').className = 'airtable-status';
    document.getElementById('at-token').value = state.airtable.token;
    document.getElementById('at-base').value = state.airtable.base;
  }

  updateUI();
  initMap();
}

function loadLocal() {
  const d = localStorage.getItem('nisho_v3');
  if (d) state = { ...state, ...JSON.parse(d) };
}

function saveLocal() {
  localStorage.setItem('nisho_v3', JSON.stringify(state));
  updateUI();
}

// ─── LOGIC & UI UPDATES ────────────────────────────────────────
function getVisitedSet() {
  return new Set(state.trips.map(t => t.country));
}

function updateUI() {
  const visited = getVisitedSet();
  const n = visited.size;
  const pct = Math.round((n / TOTAL_COUNTRIES) * 100);
  
  let days = 0;
  state.trips.forEach(t => {
    if (t.arr && t.dep) {
      days += Math.ceil(Math.abs(new Date(t.dep) - new Date(t.arr)) / (1000 * 60 * 60 * 24));
    }
  });

  document.getElementById('hdr-count').textContent = n;
  document.getElementById('stat-countries').textContent = n;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('stat-trips').textContent = state.trips.length;
  document.getElementById('stat-days').textContent = days;

  renderMap();
  renderCountries();
  renderRoadmap();
}

// ─── MAP (D3 CON ZOOM RESTRINGIDO) ─────────────────────────────
function initMap() {
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r => r.json())
    .then(world => {
      const geo = topojson.feature(world, world.objects.countries);
      geo.features.forEach(f => f.properties.iso = numToA2[parseInt(f.id)]);

      const projection = d3.geoNaturalEarth1().scale(150).translate([450, 240]);
      pathGen = d3.geoPath().projection(projection);
      
      mapSvg = d3.select('#world-map-svg');
      mapG = mapSvg.append('g');

      // Zoom Controlado: no permite salir de los límites
      zoom = d3.zoom()
        .scaleExtent([1, 6])
        .translateExtent([[0, 0], [900, 460]]) // Previene arrastrar al infinito
        .on('zoom', e => mapG.attr('transform', e.transform));
      
      mapSvg.call(zoom);

      mapG.selectAll('.country-path')
        .data(geo.features)
        .enter()
        .append('path')
        .attr('class', 'country-path')
        .attr('d', pathGen)
        .attr('stroke', '#0c0c0c')
        .attr('stroke-width', 0.5)
        .on('click', function(event, d) {
          const code = d.properties.iso;
          if (code && COUNTRIES.find(c => c.code === code)) {
            openCountrySheet(code);
          }
        });

      renderMap();
    });
}

function renderMap() {
  if (!mapG) return;
  const visited = getVisitedSet();
  mapG.selectAll('.country-path').attr('fill', d => {
    return visited.has(d.properties.iso) ? '#b8e060' : '#1e1e1e';
  });
}

// ─── COUNTRIES LIST ────────────────────────────────────────────
function renderCountries() {
  const q = document.getElementById('country-search').value.toLowerCase();
  const list = document.getElementById('countries-list');
  const visited = getVisitedSet();
  list.innerHTML = '';

  COUNTRIES.filter(c => c.name.toLowerCase().includes(q)).forEach(c => {
    const isV = visited.has(c.code);
    list.innerHTML += `
      <div class="country-item" onclick="openCountrySheet('${c.code}')">
        <span class="country-flag">${c.flag}</span>
        <div class="country-info">
          <div class="country-name">${c.name}</div>
          <div class="country-sub">${isV ? 'Visited' : 'Not visited yet'}</div>
        </div>
      </div>`;
  });
}

// ─── ROADMAP / STORYLINE ───────────────────────────────────────
function renderRoadmap() {
  const container = document.getElementById('roadmap-list');
  container.innerHTML = '';
  
  if (!state.trips.length) {
    container.innerHTML = '<div style="text-align:center; color:#555; font-size:12px; margin-top:40px;">No trips logged yet. Tap + to add your first trip.</div>';
    return;
  }

  const sorted = [...state.trips].sort((a,b) => new Date(b.arr) - new Date(a.arr));

  sorted.forEach(t => {
    const c = COUNTRIES.find(x => x.code === t.country) || {name:'Unknown', flag:'🌍'};
    const days = t.arr && t.dep ? Math.ceil(Math.abs(new Date(t.dep) - new Date(t.arr)) / 86400000) : 0;
    
    let detailsHtml = '';
    if (t.cities) detailsHtml += `<div class="detail-line"><span class="detail-icon">📍</span> ${t.cities}</div>`;
    if (t.hotels) detailsHtml += `<div class="detail-line"><span class="detail-icon">🏨</span> <span class="hotel-highlight">${t.hotels}</span></div>`;

    container.innerHTML += `
      <div class="trip-card" onclick="openTripForm('${t.id}')">
        <div class="trip-header">
          <div>
            <div class="trip-country">${c.flag} ${c.name}</div>
            <div class="trip-dates">${t.arr} • ${days} days</div>
          </div>
          <div class="trip-trans">${t.trans.split(' ')[0]}</div>
        </div>
        ${detailsHtml ? `<div class="trip-details">${detailsHtml}</div>` : ''}
      </div>`;
  });
}

// ─── MODALS & FORMS ────────────────────────────────────────────
function openCountrySheet(code) {
  currentCountryContext = code;
  const c = COUNTRIES.find(x => x.code === code);
  document.getElementById('cs-flag').textContent = c.flag;
  document.getElementById('cs-name').textContent = c.name;
  
  const history = document.getElementById('cs-history');
  const trips = state.trips.filter(t => t.country === code).sort((a,b) => new Date(b.arr) - new Date(a.arr));
  
  if(trips.length) {
    history.innerHTML = '<div style="font-size:10px; color:#555; text-transform:uppercase; margin-bottom:8px;">Past Visits</div>';
    trips.forEach(t => {
      history.innerHTML += `<div style="background:#181818; padding:12px; border-radius:8px; margin-bottom:8px; font-size:13px; cursor:pointer;" onclick="closeModal('country-sheet'); openTripForm('${t.id}')">
        <strong style="color:#e8e4de">${t.arr}</strong>
        ${t.cities ? `<br><span style="color:#888">📍 ${t.cities}</span>` : ''}
        ${t.hotels ? `<br><span style="color:#b8e060">🏨 ${t.hotels}</span>` : ''}
      </div>`;
    });
  } else {
    history.innerHTML = '<div style="text-align:center; color:#555; font-size:12px;">You haven\'t visited this country yet.</div>';
  }

  document.getElementById('country-sheet').classList.add('open');
}

function openTripFormFromCountry() {
  closeModal('country-sheet');
  openTripForm(null, currentCountryContext);
}

function openTripForm(tripId = null, prefillCountry = null) {
  currentEditingId = tripId;
  const modal = document.getElementById('trip-modal');
  
  if (tripId) {
    const t = state.trips.find(x => x.id === tripId);
    document.getElementById('tm-title').textContent = 'Edit Trip';
    document.getElementById('tm-delete').style.display = 'block';
    
    document.getElementById('i-country').value = t.country;
    document.getElementById('i-arr').value = t.arr;
    document.getElementById('i-dep').value = t.dep;
    document.getElementById('i-trans').value = t.trans;
    document.getElementById('i-cities').value = t.cities || '';
    document.getElementById('i-hotels').value = t.hotels || '';
  } else {
    document.getElementById('tm-title').textContent = 'Log Trip';
    document.getElementById('tm-delete').style.display = 'none';
    
    document.getElementById('i-country').value = prefillCountry || '';
    document.getElementById('i-arr').value = '';
    document.getElementById('i-dep').value = '';
    document.getElementById('i-trans').value = '✈️ Plane';
    document.getElementById('i-cities').value = '';
    document.getElementById('i-hotels').value = '';
  }
  
  modal.classList.add('open');
}

function saveTrip() {
  const c = document.getElementById('i-country').value;
  if (!c) return alert("Please select a country");

  const tripData = {
    country: c,
    arr: document.getElementById('i-arr').value,
    dep: document.getElementById('i-dep').value,
    trans: document.getElementById('i-trans').value,
    cities: document.getElementById('i-cities').value,
    hotels: document.getElementById('i-hotels').value
  };

  if (currentEditingId) {
    const idx = state.trips.findIndex(t => t.id === currentEditingId);
    state.trips[idx] = { ...state.trips[idx], ...tripData };
    if (state.airtable.connected) syncToAirtable(state.trips[idx], 'PATCH');
  } else {
    const newTrip = { id: Date.now().toString(), ...tripData };
    state.trips.push(newTrip);
    if (state.airtable.connected) syncToAirtable(newTrip, 'POST');
  }

  saveLocal();
  closeModal('trip-modal');
}

function deleteCurrentTrip() {
  if(!confirm("Delete this trip?")) return;
  const trip = state.trips.find(t => t.id === currentEditingId);
  state.trips = state.trips.filter(t => t.id !== currentEditingId);
  
  if (state.airtable.connected && trip.airtableId) {
    syncToAirtable(trip, 'DELETE');
  }
  
  saveLocal();
  closeModal('trip-modal');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ─── AIRTABLE SYNC ─────────────────────────────────────────────
/*
  AIRTABLE SETUP:
  Table Name: Trips
  Fields:
  - ID (Single line text)
  - Country (Single line text - ISO code like 'JP')
  - Arrival (Date)
  - Departure (Date)
  - Transport (Single line text)
  - Cities (Single line text)
  - Hotels (Single line text)
*/

function showSync(msg, isError = false) {
  const bar = document.getElementById('sync-bar');
  bar.textContent = msg; bar.className = 'sync-bar visible' + (isError ? ' error' : '');
  setTimeout(() => bar.classList.remove('visible'), 2500);
}

async function connectAirtable() {
  const token = document.getElementById('at-token').value.trim();
  const base = document.getElementById('at-base').value.trim();
  const table = document.getElementById('at-trips-table').value.trim() || 'Trips';

  if (!token || !base) return alert("Fill token and base ID");
  
  state.airtable = { token, base, tripsTable: table, connected: false };
  showSync("Connecting...");

  try {
    const res = await fetch(`https://api.airtable.com/v0/${base}/${encodeURIComponent(table)}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if(!res.ok) throw new Error("Connection failed");
    
    const data = await res.json();
    
    // Merge remote data into local state
    const remoteTrips = data.records.map(r => ({
      airtableId: r.id,
      id: r.fields.ID || r.id,
      country: r.fields.Country || '',
      arr: r.fields.Arrival || '',
      dep: r.fields.Departure || '',
      trans: r.fields.Transport || '✈️ Plane',
      cities: r.fields.Cities || '',
      hotels: r.fields.Hotels || ''
    }));

    // Replace local trips with remote for simplicity (Assuming Airtable is Source of Truth)
    state.trips = remoteTrips;
    state.airtable.connected = true;
    
    document.getElementById('at-status').textContent = 'Connected';
    document.getElementById('at-status').className = 'airtable-status';
    saveLocal();
    showSync("Sync Successful!");
  } catch(e) {
    showSync(e.message, true);
  }
}

async function syncToAirtable(trip, method) {
  const { token, base, tripsTable } = state.airtable;
  const url = `https://api.airtable.com/v0/${base}/${encodeURIComponent(tripsTable)}` + (method !== 'POST' ? `/${trip.airtableId}` : '');
  
  const body = method === 'DELETE' ? null : JSON.stringify({
    fields: {
      ID: trip.id,
      Country: trip.country,
      Arrival: trip.arr || null,
      Departure: trip.dep || null,
      Transport: trip.trans,
      Cities: trip.cities,
      Hotels: trip.hotels
    }
  });

  try {
    const res = await fetch(url, {
      method,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body
    });
    const data = await res.json();
    if(method === 'POST' && data.id) {
      // Update local item with generated Airtable ID
      const idx = state.trips.findIndex(t => t.id === trip.id);
      if(idx > -1) state.trips[idx].airtableId = data.id;
      saveLocal();
    }
  } catch(e) { console.error("Airtable sync error", e); }
}

// ─── NAVIGATOR ─────────────────────────────────────────────────
function switchScreen(id, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  btn.classList.add('active');
}
